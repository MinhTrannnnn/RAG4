[project]
name = "rag-competition-student"
version = "0.1.0"
description = "FastAPI student server for an offline RAG competition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface_hub>=0.23.0",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
